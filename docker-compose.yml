services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ticketintel
      POSTGRES_USER: ticketintel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ticketintel}
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketintel -d ticketintel"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build: ./ml-service
    env_file: .env
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketintel
      SPRING_DATASOURCE_USERNAME: ticketintel
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-ticketintel}
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      postgres: { condition: service_healthy }
      ml-service: { condition: service_healthy }
    ports: ["8080:8080"]

volumes:
  pgdata:
